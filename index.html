<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="do_you_love_me.css" />
    <title> Be My Valentine-JG</title>
  </head>
  <body>
    <!-- for more code, visit my tiktok account -->
    <!-- tiktok "meowish" -->

    <div class="question-container container">
      <div class="image-wrapper">
        <img 
          src="her-picture.jpg" 
          alt="Her Picture"
          class="valentine-image"
        />
      </div>
    

      <h2 class="question">Would you be my Valentine?</h2>
      <div class="button-container">
        <button class="yes-btn btn js-yes-btn">Yes</button>
        <button class="no-btn btn js-no-btn">No</button>
      </div>
    </div>
   
    <iframe
    id="letterFrame"
    src="./valentine-confession.html"
    style="
      display: none;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: none;
      position: relative;
      z-index: 10;
    ">
  </iframe>
  
  </iframe>
  

    <div class="cssload-main">
      <div class="cssload-heart">
        <span class="cssload-heartL"></span>
        <span class="cssload-heartR"></span>
        <span class="cssload-square"></span>
      </div>
      <div class="cssload-shadow"></div>
    </div>
    <script src="do_you_love_me.js"></script>

    <footer class="site-footer">
      Made with ❤️ by Jason Gomes
    </footer>
    
  </body>
</html>
